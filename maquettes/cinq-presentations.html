<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinq présentations — maquette</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1c1a; --muted: #6a6963; --line: #e3e1d9; --soft: #efede6;
  --accent: #2f5d50; --accent-soft: #e2ede9; --warn: #9a3412; --warn-soft: #fcebe2;
  --pres: #7c5b12; --pres-soft: #f8f0dc; --none: #8a887f;
  --t1: #2f5d50; --t2: #4a6fa5; --t3: #8a6d1e;
  --serif: Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151513; --panel: #1e1e1b; --ink: #ebeae4; --muted: #a2a097; --line: #33322d; --soft: #262622;
    --accent: #8cc4b2; --accent-soft: #22322d; --warn: #f0a37a; --warn-soft: #3a251b;
    --pres: #e3c27a; --pres-soft: #352d1a; --none: #8f8d84; --t1: #8cc4b2; --t2: #9db8e0; --t3: #d9bd6a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topin { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.topin .t { font-weight: 700; margin-right: 8px; }
.sw { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.sw[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 70px; }
.intro { color: var(--muted); font-size: 14px; margin: 0 0 16px; max-width: 760px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: 1px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.st-none { color: var(--none); }
.st-warn { color: var(--warn); font-weight: 600; }
.st-pres { color: var(--pres); font-weight: 600; }
input[type=search], select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: 100%; }

/* A — encyclopédie */
.enc { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
.enc nav { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; }
.enc nav ul { list-style: none; padding: 0; margin: 10px 0 0; }
.enc nav li button { background: none; border: 0; padding: 4px 6px; cursor: pointer; text-align: left; width: 100%; border-radius: 6px; }
.enc nav li button[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.enc nav .letter { font-weight: 700; color: var(--muted); font-size: 12px; margin-top: 10px; }
article.wiki { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 34px; font-family: var(--serif); font-size: 16.5px; line-height: 1.6; }
article.wiki h1 { font-size: 34px; margin: 0; font-weight: 600; }
article.wiki .sub { font-family: system-ui, sans-serif; color: var(--muted); font-size: 14px; margin: 2px 0 16px; }
article.wiki h2 { font-size: 21px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 26px 0 8px; font-weight: 600; }
article.wiki .box { font-family: system-ui, sans-serif; font-size: 14px; background: var(--soft); border-radius: 10px; padding: 12px 16px; }
article.wiki sup a { text-decoration: none; color: var(--accent); font-family: system-ui, sans-serif; font-size: 11px; }
article.wiki .gap { color: var(--muted); font-style: italic; }
article.wiki ol.notes { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); padding-left: 22px; }
article.wiki ol.notes li { margin-bottom: 8px; }

/* B — arbre */
.tree { display: grid; grid-template-columns: 220px 1fr 340px; gap: 18px; align-items: start; }
.glist button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.glist button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.gcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.gcard h2 { margin: 0; font-size: 22px; }
.kf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; }
.kf div { background: var(--soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.kf b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.branches { margin: 0 0 0 26px; border-left: 2px solid var(--line); padding: 14px 0 0 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.leaf { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 11px; cursor: pointer; text-align: left; }
.leaf::before { content: ""; position: absolute; left: -19px; top: 18px; width: 17px; border-top: 2px solid var(--line); }
.leaf[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.leaf small { display: block; color: var(--muted); font-size: 12px; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
.side h3 { margin: 0 0 2px; font-size: 19px; }
.side h4 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.side .f { font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }

/* C — questions */
.qs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 18px; }
.q { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px; cursor: pointer; text-align: left; font-weight: 600; font-size: 15.5px; }
.q small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.q[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.col h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 9px; font-size: 13.5px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); }
.why { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }

/* D — carte */
.phonewrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.phone { width: 380px; max-width: 100%; background: var(--panel); border: 10px solid var(--ink); border-radius: 36px; padding: 18px 14px; min-height: 640px; }
.idhead { border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 4px; }
.idhead h2 { margin: 0; font-size: 26px; }
.idrow { border-bottom: 1px solid var(--line); padding: 9px 2px; cursor: pointer; }
.idrow .l { display: flex; justify-content: space-between; gap: 10px; }
.idrow .p { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.idrow .v { font-size: 14px; font-weight: 600; margin-top: 1px; }
.idrow .more { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.idrow .more div { padding: 4px 0; border-top: 1px dashed var(--line); }
.scan { flex: 1; min-width: 240px; max-width: 420px; }

/* E — chronologie */
.tl { position: relative; margin-left: 110px; border-left: 2px solid var(--line); padding-left: 22px; }
.ev { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; margin-bottom: 10px; }
.ev::before { content: ""; position: absolute; left: -30px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.ev .d { position: absolute; left: -132px; top: 10px; width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }
.ev .h { font-weight: 600; }
.yr { margin: 18px 0 10px -22px; font-weight: 800; font-size: 20px; }
.gpick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

@media (max-width: 900px) {
  .enc, .tree { grid-template-columns: 1fr; }
  .enc nav, .side { position: static; max-height: none; }
  article.wiki { padding: 18px; }
  .tl { margin-left: 0; } .ev .d { position: static; text-align: left; width: auto; }
}
</style>
</head>

<div class="top"><div class="topin">
  <span class="t">Maquette · 5 présentations</span>

  <button class="sw" data-v="B" aria-pressed="false">B · Arbre de propriété</button>
  <button class="sw" data-v="C" aria-pressed="false">C · Questions</button>
  <button class="sw" data-v="D" aria-pressed="false">D · Carte d'identité</button>
  <button class="sw" data-v="E" aria-pressed="false">E · Chronologie</button>
</div></div>

  <section id="vB" hidden></section>
  <section id="vC" hidden></section>
  <section id="vD" hidden></section>
  <section id="vE" hidden></section>
</div>

const ORDER = ["ANI", "ENV", "PLA", "WAT", "LAB", "SUP", "GOV", "TAX", "GEO", "INV"];
const DIMS = DATA[0].dims;
const ICON = { ANI: "🐄", ENV: "🌍", PLA: "🧴", WAT: "💧", LAB: "👥", SUP: "🔗", GOV: "🏛️", TAX: "💶", GEO: "🗺️", INV: "🏦" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (x, d = 1) => Number(x).toLocaleString("fr-FR", { maximumFractionDigits: d });
const dfr = (d) => d ? d.split("-").reverse().join("/") : "";
const m1 = (re, s) => { const m = (s || "").match(re); return m ? m[1].trim() : null; };
const TIER = { regulatory: ["Source officielle", 1], audited_ngo: ["Organisme reconnu", 2], press: ["Déclaration publique", 3], crowd: ["Signalement", 3] };
const tier = (ev) => /^Site officiel/.test(ev.excerpt || "") ? ["Site officiel de la marque", 3] : (TIER[ev.tier] || [ev.tier, 3]);
const tdot = (ev) => `<i class="dot" style="background:var(--t${tier(ev)[1]})"></i>`;

function short(i) {
  const e = i.ev; if (!e) return null;
  const x = e.excerpt || "", v = e.value;
  switch (i.code) {
    case "ANI_EXPLOITATION": return "Oui (" + (m1(/exploitation animale \(([^)]+)\)/, x) || m1(/— ([^—]+)$/, x) || "documentée") + ")";
    case "ANI_ANIMAL_FREE": return "100 % végétale (prouvé)";
    case "ANI_FUR_FREE": return "Membre du label « sans fourrure »";
    case "ANI_BBFAW_TIER": return "Niveau " + nf(v, 0) + " sur 6 (1 = meilleur)";
    case "GEO_RUSSIA_EXIT": return m1(/— ([^;]+);/, x) || "documentée";
    case "GEO_LOBBYING_TRANSP": return /HATVP|répertoire/.test(x + e.source) ? "Inscrit au répertoire de la HATVP" : "Inscrit au registre européen";
    case "GEO_LOBBYING_SPEND": return m1(/déclarés[^:]*: ([^,]+(?:€[^,]*€)?)/, x) || m1(/(\d[\d  ]* (?:à|-) \d[\d  ]* €)/, x) || nf(v, 0) + " €";
    case "ENV_CDP_CLIMATE": case "WAT_CDP": return "Note " + (m1(/note ([A-F][+-]?)/, x) || "?") + " (de A à D-)";
    case "ENV_SBTI_VALIDATED": return (m1(/— (objectif[^(]+\([^)]*\))/, x) || "objectif validé") + ", un engagement";
    case "SUP_LIVING_WAGE": return "Note " + (m1(/note ([A-E])/, x) || "?") + " (de A à E)";
    case "SUP_VIGILANCE_PLAN": return "Publié";
    case "ENV_SCOPE3_DISCLOSED": return "Publiées";
    case "PLA_POLLUTER": return "Parmi les plus gros pollueurs plastique";
    case "SUP_FTI_SCORE": return nf(v) + " % des points de transparence";
    case "LAB_CEO_PAY_RATIO": return nf(v, 0) + " fois le salaire médian";
    case "LAB_GENDER_PAYGAP": return v < 0 ? nf(-v) + " % en faveur des femmes" : nf(v) + " % en faveur des hommes";
    case "GOV_SANCTIONS": return m1(/(amende[^.;]*)/i, x) || "Décision officielle";
  }
  if (v == null) return "Documenté";
  switch (i.unit) {
    case "%": return nf(v) + " %";
    case "score/100": return nf(v, 0) + "/100";
    case "%/an": return (v > 0 ? "+" : "−") + nf(Math.abs(v), 2) + " % par an";
    case "tCO2e/M€": return nf(v, 0) + " t CO₂e par M€ de chiffre d'affaires";
  }
  return nf(v) + (i.unit ? " " + i.unit : "");
}
// État d'un indicateur : documenté, obligatoire mais absent, présumé (exploitation animale), inconnu.
function state(i) {
  if (i.ev) return { s: "ok", t: short(i) };
  if (i.code === "ANI_EXPLOITATION") return { s: "pres", t: "Non documentée, présumée dans ce secteur" };
  if (i.mandatory) return { s: "warn", t: "Obligatoire, absent de notre relevé" };
  return { s: "none", t: "Aucune information" };
}
const cls = (s) => ({ ok: "", none: "st-none", warn: "st-warn", pres: "st-pres" }[s]);
const byDim = (e) => { const m = new Map(); for (const i of e.inds) { if (!m.has(i.dim)) m.set(i.dim, []); m.get(i.dim).push(i); } return m; };
const isGroup = (e) => e.chain.length === 1;
const owner = (e) => e.chain.slice(1).join(" → ");
const GROUPS = DATA.filter(isGroup);
const BRANDS = DATA.filter((e) => !isGroup(e));
const brandsOf = (g) => BRANDS.filter((b) => b.chain[b.chain.length - 1] === g.name);
// Fait principal d'un pilier : exploitation animale d'abord, puis le mieux sourcé, hors donnée de contexte.
const PRIO = { ANI: ["ANI_EXPLOITATION", "ANI_ANIMAL_FREE"], ENV: ["ENV_GHG_TREND", "ENV_CDP_CLIMATE", "ENV_SBTI_VALIDATED"], LAB: ["LAB_EGAPRO_INDEX"], GEO: ["GEO_RUSSIA_EXIT", "GEO_LOBBYING_TRANSP"], SUP: ["SUP_VIGILANCE_PLAN", "SUP_LIVING_WAGE"], TAX: ["TAX_EFFECTIVE_RATE"] };
function keyFact(inds, d) {
  const pr = PRIO[d] || [];
  for (const c of pr) { const i = inds.find((x) => x.code === c); if (i && (i.ev || c === "ANI_EXPLOITATION")) return i; }
  const w = inds.find((i) => !i.ev && i.mandatory); if (w) return w;
  return inds.filter((i) => i.ev && !i.contextual).sort((a, b) => tier(a.ev)[1] - tier(b.ev)[1])[0] || null;
}

let curA = "candia";
function renderA() {
  const q = (document.getElementById("qa")?.value || "").toLowerCase();
  const list = DATA.filter((e) => e.name.toLowerCase().includes(q));
  let nav = "", last = "";
  for (const e of list) {
    const L = e.name[0].toUpperCase();
    if (L !== last) { nav += `<li class="letter">${esc(L)}</li>`; last = L; }
    nav += `<li><button data-s="${e.slug}" aria-current="${e.slug === curA}">${esc(e.name)}${isGroup(e) ? ' <span class="badge">groupe</span>' : ""}</button></li>`;
  }
  const e = DATA.find((x) => x.slug === curA);
  const notes = [];
  const cite = (i) => { notes.push(i); return `<sup><a href="#n${notes.length}">[${notes.length}]</a></sup>`; };
  const by = byDim(e);
  const doc = e.inds.filter((i) => i.ev).length;
  const emptyDims = ORDER.filter((d) => by.get(d) && !by.get(d).some((i) => i.ev));
  let art = `<h1>${esc(e.name)}</h1><div class="sub">${isGroup(e) ? `Groupe · ${brandsOf(e).length} marque(s) suivie(s)` : `Marque · appartient à ${esc(owner(e))}`}</div>
    <div class="box"><b>En bref.</b> ${doc} information(s) documentée(s) sur ${e.inds.length} recherchées.
    ${emptyDims.length ? `Aucune information sur : ${emptyDims.map((d) => esc(DIMS[d])).join(", ")}.` : ""}
    ${!isGroup(e) ? ` Les données de groupe viennent de ${esc(e.chain[e.chain.length - 1])}, qui reçoit l'argent des achats.` : ""}</div>`;
  for (const d of ORDER) {
    const inds = by.get(d); if (!inds) continue;
    art += `<h2>${esc(DIMS[d])}</h2><p>`;
    const said = [];
    for (const i of inds) {
      const st = state(i);
      if (st.s === "ok") said.push(`${esc(i.name)} : <b>${esc(st.t)}</b>${i.ev.from ? ` (donnée de ${esc(i.ev.from)})` : ""}${cite(i)}.`);
      else if (st.s === "pres") said.push(`${esc(i.name)} : <span class="st-pres">${esc(st.t)}</span>.`);
      else if (st.s === "warn") said.push(`${esc(i.name)} : <span class="st-warn">imposée par la loi (${esc((i.regimes || []).join(", "))}), absente de notre relevé</span>.`);
    }
    const none = inds.filter((i) => state(i).s === "none");
    art += said.join(" ") + (none.length ? ` <span class="gap">Aucune information publiée sur : ${none.map((i) => esc(i.name)).join(" · ")}.</span>` : "") + "</p>";
  }
  art += `<h2>Sources</h2><ol class="notes">${notes.map((i, k) => `<li id="n${k + 1}">${tdot(i.ev)}${esc(tier(i.ev)[0])} · ${esc(i.ev.source)} · relevé le ${dfr(i.ev.date)} — ${esc(i.ev.excerpt)} ${i.ev.url ? `<a href="${esc(i.ev.url)}" target="_blank" rel="noopener">lien</a>` : ""}</li>`).join("")}</ol>`;
  document.getElementById("vA").innerHTML = `<p class="intro">Une fiche par marque ou par groupe, qui se lit comme un article. Les faits sont écrits en phrases et les sources sont en notes, numérotées. Ce qu'on ignore est écrit en toutes lettres.</p>
    <div class="enc"><nav><input type="search" id="qa" placeholder="Chercher une marque ou un groupe" value="${esc(q)}"><ul>${nav}</ul></nav><article class="wiki">${art}</article></div>`;
  const qa = document.getElementById("qa"); qa.oninput = renderA; if (q) { qa.focus(); qa.setSelectionRange(q.length, q.length); }
  document.querySelector("#vA nav ul").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.s; if (s) { curA = s; renderA(); scrollTo(0, 0); } };
}

/* ---------- B : arbre ---------- */
let curG = "sodiaal", curB = null;
function renderB() {
  const g = DATA.find((x) => x.slug === curG);
  const bs = brandsOf(g);
  const gby = byDim(g);
  const kf = ORDER.map((d) => { const inds = gby.get(d); if (!inds) return ""; const i = keyFact(inds, d); const st = i ? state(i) : { s: "none", t: "Aucune information" };
    return `<div><b>${ICON[d]} ${esc(DIMS[d])}</b><span class="${cls(st.s)}">${esc(st.t)}</span></div>`; }).join("");
  const b = curB ? DATA.find((x) => x.slug === curB) : null;
  let side = `<p class="muted small">Cliquez sur une marque pour voir ce qui lui est propre et ce qu'elle tient de son groupe.</p>`;
  if (b) {
    const own = b.inds.filter((i) => i.ev && !i.ev.from), inh = b.inds.filter((i) => i.ev && i.ev.from);
    const ani = b.inds.find((i) => i.code === "ANI_EXPLOITATION");
    side = `<h3>${esc(b.name)}</h3><div class="muted small">appartient à ${esc(owner(b))}</div>
      <h4>Propre à la marque (${own.length + (ani && !ani.ev ? 1 : 0)})</h4>
      ${own.map((i) => `<div class="f">${tdot(i.ev)}<b>${esc(i.name)}</b> : ${esc(short(i))}</div>`).join("")}
      ${ani && !ani.ev ? `<div class="f st-pres">${esc(ani.name)} : non documentée, présumée dans ce secteur</div>` : ""}
      <h4>Tenu du groupe (${inh.length})</h4>
      ${inh.map((i) => `<div class="f">${tdot(i.ev)}<b>${esc(i.name)}</b> : ${esc(short(i))} <span class="badge">${esc(i.ev.from)}</span></div>`).join("") || '<div class="f st-none">Aucune information</div>'}
      <h4>Rien de connu sur</h4><div class="f st-none small">${b.inds.filter((i) => state(i).s === "none").map((i) => esc(i.name)).join(" · ")}</div>`;
  }
  document.getElementById("vB").innerHTML = `<p class="intro">On entre par le propriétaire : c'est lui qui reçoit l'argent. La fiche du groupe porte les faits qui le concernent ; chaque marque montre ce qui lui est propre et ce qu'elle tient de son groupe.</p>
    <div class="tree"><div class="glist">${GROUPS.map((x) => `<button data-g="${x.slug}" aria-pressed="${x.slug === curG}"><b>${esc(x.name)}</b><div class="small muted">${brandsOf(x).length} marque(s) suivie(s)</div></button>`).join("")}</div>
    <div><div class="gcard"><h2>${esc(g.name)}</h2><div class="muted small">${g.inds.filter((i) => i.ev).length} information(s) documentée(s) sur ${g.inds.length} · un fait clé par pilier</div><div class="kf">${kf}</div></div>
      <div class="branches">${bs.map((x) => `<button class="leaf" data-b="${x.slug}" aria-pressed="${x.slug === curB}"><b>${esc(x.name)}</b><small>${x.chain.length > 2 ? "via " + esc(x.chain[1]) : "détenue directement"}</small></button>`).join("")}</div></div>
    <aside class="side">${side}</aside></div>`;
  document.querySelector("#vB .glist").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.g; if (s) { curG = s; curB = null; renderB(); } };
  document.querySelector("#vB .branches").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.b; if (s) { curB = s; renderB(); } };
}

/* ---------- C : questions ---------- */
const find = (e, c) => e.inds.find((i) => i.code === c);
const Q = [
  { id: "ani", q: "Cette marque exploite-t-elle des animaux ?", sub: "lait, viande, œufs, cuir, tests…", cols: ["Oui", "Non (100 % végétale, prouvé)", "Non documentée, présumée"],
    f: (e) => { const i = find(e, "ANI_EXPLOITATION"), v = find(e, "ANI_ANIMAL_FREE"); if (v?.ev) return [1, v]; if (!i) return null; return i.ev ? [0, i] : [2, i]; } },
  { id: "rus", q: "Est-elle encore présente en Russie ?", sub: "depuis l'invasion de l'Ukraine (KSE Institute)", cols: ["Oui, encore présente", "En partie ou en cours de sortie", "Non, sortie effective", "On ne sait pas"],
    f: (e) => { const i = find(e, "GEO_RUSSIA_EXIT"); if (!i) return null; if (!i.ev) return [3, i]; const t = short(i); return [/effective/.test(t) ? 2 : /poursuivie/.test(t) ? 0 : 1, i]; } },
  { id: "lob", q: "Son lobbying est-il déclaré ?", sub: "répertoire de la HATVP ou registre européen", cols: ["Oui, déclaré", "On ne sait pas"],
    f: (e) => { const i = find(e, "GEO_LOBBYING_TRANSP"); if (!i) return null; return [i.ev ? 0 : 1, i]; } },
  { id: "sbti", q: "A-t-elle un objectif climat validé ?", sub: "par l'initiative SBTi (un engagement, pas un résultat)", cols: ["Oui", "On ne sait pas"],
    f: (e) => { const i = find(e, "ENV_SBTI_VALIDATED"); if (!i) return null; return [i.ev ? 0 : 1, i]; } },
  { id: "ghg", q: "Ses émissions baissent-elles vraiment ?", sub: "évolution mesurée sur au moins deux ans", cols: ["Oui, en baisse", "Non, stables ou en hausse", "On ne sait pas"],
    f: (e) => { const i = find(e, "ENV_GHG_TREND"); if (!i) return null; if (!i.ev) return [2, i]; return [i.ev.value < -0.5 ? 0 : 1, i]; } },
  { id: "pay", q: "Publie-t-elle l'écart de salaire femmes-hommes ?", sub: "obligatoire pour les grands groupes européens", cols: ["Oui", "Obligatoire, absent de notre relevé", "On ne sait pas"],
    f: (e) => { const i = find(e, "LAB_GENDER_PAYGAP"); if (!i) return null; return [i.ev ? 0 : i.mandatory ? 1 : 2, i]; } },
  { id: "vig", q: "A-t-elle un plan de vigilance ?", sub: "droits humains chez les fournisseurs", cols: ["Oui, publié", "Obligatoire, absent de notre relevé", "On ne sait pas"],
    f: (e) => { const i = find(e, "SUP_VIGILANCE_PLAN"); if (!i) return null; return [i.ev ? 0 : i.mandatory ? 1 : 2, i]; } },
  { id: "pla", q: "Est-elle parmi les plus gros pollueurs plastique ?", sub: "audits de déchets de Break Free From Plastic", cols: ["Oui", "On ne sait pas"],
    f: (e) => { const i = find(e, "PLA_POLLUTER"); if (!i) return null; return [i.ev ? 0 : 1, i]; } },
];
let curQ = "ani", curC = null, scopeC = "brands";
function renderC() {
  const q = Q.find((x) => x.id === curQ);
  const pool = scopeC === "brands" ? BRANDS : GROUPS;
  const cols = q.cols.map(() => []);
  for (const e of pool) { const r = q.f(e); if (r) cols[r[0]].push([e, r[1]]); }
  let why = "";
  if (curC) { const e = DATA.find((x) => x.slug === curC); const r = q.f(e); if (r) { const i = r[1], st = state(i);
    why = `<div class="why"><b>${esc(e.name)}</b> <span class="muted small">(${esc(owner(e) || "groupe")})</span> — <span class="${cls(st.s)}">${esc(st.t)}</span>
      ${i.ev ? `<div class="small muted" style="margin-top:6px">${tdot(i.ev)}${esc(tier(i.ev)[0])} · ${esc(i.ev.source)} · relevé le ${dfr(i.ev.date)}${i.ev.from ? " · donnée de " + esc(i.ev.from) : ""}</div><div class="small" style="margin-top:4px">« ${esc(i.ev.excerpt)} »</div>${i.ev.url ? `<a class="small" href="${esc(i.ev.url)}" target="_blank" rel="noopener">voir la source</a>` : ""}` : ""}</div>`; } }
  document.getElementById("vC").innerHTML = `<p class="intro">On entre par une question concrète. Chaque réponse est un fait sourcé, sans note ni jugement ; « on ne sait pas » est une réponse à part entière. Cliquez sur une marque pour voir la preuve.</p>
    <div class="qs">${Q.map((x) => `<button class="q" data-q="${x.id}" aria-pressed="${x.id === curQ}">${esc(x.q)}<small>${esc(x.sub)}</small></button>`).join("")}</div>
    <div class="gpick"><button class="sw" data-sc="brands" aria-pressed="${scopeC === "brands"}">Marques (${BRANDS.length})</button><button class="sw" data-sc="groups" aria-pressed="${scopeC === "groups"}">Groupes (${GROUPS.length})</button></div>
    <div class="ans">${q.cols.map((c, k) => `<div class="col"><h3><span>${esc(c)}</span><span class="muted">${cols[k].length}</span></h3><div class="chips">${cols[k].map(([e]) => `<button class="chip" data-c="${e.slug}" aria-pressed="${e.slug === curC}">${esc(e.name)}</button>`).join("") || '<span class="muted small">aucune</span>'}</div></div>`).join("")}</div>${why}`;
  const v = document.getElementById("vC");
  v.querySelector(".qs").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.q; if (s) { curQ = s; curC = null; renderC(); } };
  v.querySelector(".gpick").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.sc; if (s) { scopeC = s; curC = null; renderC(); } };
  v.querySelector(".ans").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.c; if (s) { curC = s; renderC(); } };
}

/* ---------- D : carte d'identité ---------- */
let curD = "yoplait", openD = null;
function renderD() {
  const e = DATA.find((x) => x.slug === curD);
  const by = byDim(e);
  const rows = ORDER.map((d) => {
    const inds = by.get(d); if (!inds) return "";
    const i = keyFact(inds, d); const st = i ? state(i) : { s: "none", t: "Aucune information" };
    const n = inds.filter((x) => x.ev).length;
    const more = openD === d ? `<div class="more">${inds.map((x) => { const s = state(x); return `<div>${x.ev ? tdot(x.ev) : ""}${esc(x.name)} : <span class="${cls(s.s)}">${esc(s.t)}</span>${x.ev ? ` <span class="muted">· ${esc(x.ev.source)}, ${dfr(x.ev.date)}${x.ev.from ? ", donnée de " + esc(x.ev.from) : ""}</span>` : ""}</div>`; }).join("")}</div>` : "";
    return `<div class="idrow" data-d="${d}"><div class="l"><span class="p">${ICON[d]} ${esc(DIMS[d])}</span><span class="small muted">${n}/${inds.length} ${openD === d ? "▴" : "▾"}</span></div><div class="v ${cls(st.s)}">${esc(st.t)}${i && i.ev && i.ev.from ? ` <span class="badge">${esc(i.ev.from)}</span>` : ""}</div>${more}</div>`;
  }).join("");
  document.getElementById("vD").innerHTML = `<p class="intro">La version « en rayon » : on scanne le code-barres, on voit en dix lignes l'essentiel, un fait par pilier. Un appui sur une ligne déroule tout le pilier et ses sources.</p>
    <div class="phonewrap"><div class="phone"><div class="idhead"><div class="small muted">CARTE D'IDENTITÉ</div><h2>${esc(e.name)}</h2>
      <div class="small">${isGroup(e) ? "Groupe" : `Appartient à <b>${esc(owner(e))}</b>`}</div></div>${rows}
      <p class="small muted" style="margin-top:10px">${e.inds.filter((i) => i.ev).length} information(s) documentée(s) sur ${e.inds.length} · aucune note, que des faits</p></div>
    <div class="scan"><label class="small muted" for="pd">Simuler un scan :</label><select id="pd">${DATA.map((x) => `<option value="${x.slug}" ${x.slug === curD ? "selected" : ""}>${esc(x.name)}${isGroup(x) ? " (groupe)" : ""}</option>`).join("")}</select>
      <p class="small muted" style="margin-top:14px">Légende : <i class="dot" style="background:var(--t1)"></i>source officielle · <i class="dot" style="background:var(--t2)"></i>organisme reconnu · <i class="dot" style="background:var(--t3)"></i>déclaration publique · <span class="st-pres">présumé</span> · <span class="st-warn">obligatoire mais absent</span> · <span class="st-none">aucune information</span></p></div></div>`;
  document.getElementById("pd").onchange = (ev) => { curD = ev.target.value; openD = null; renderD(); };
  document.querySelector("#vD .phone").onclick = (ev) => { const d = ev.target.closest(".idrow")?.dataset.d; if (d) { openD = openD === d ? null : d; renderD(); } };
}

/* ---------- E : chronologie ---------- */
let curE = "danone";
function renderE() {
  const g = DATA.find((x) => x.slug === curE);
  const evs = g.inds.filter((i) => i.ev && !i.ev.from).sort((a, b) => b.ev.date.localeCompare(a.ev.date));
  let h = "", yr = "";
  for (const i of evs) {
    const y = i.ev.date.slice(0, 4);
    if (y !== yr) { h += `<div class="yr">${y}</div>`; yr = y; }
    h += `<div class="ev"><span class="d">${dfr(i.ev.date)}</span><div class="small muted">${ICON[i.dim]} ${esc(DIMS[i.dim])}</div>
      <div class="h">${esc(i.name)} : ${esc(short(i))}</div>
      <div class="small muted">${tdot(i.ev)}${esc(tier(i.ev)[0])} · ${esc(i.ev.source)}${i.ev.url ? ` · <a href="${esc(i.ev.url)}" target="_blank" rel="noopener">source</a>` : ""}</div></div>`;
  }
  const gaps = g.inds.filter((i) => state(i).s !== "ok");
  document.getElementById("vE").innerHTML = `<p class="intro">Le dossier d'un groupe, dans l'ordre du temps : ce que disent les sources, et quand. Utile pour voir ce qui est récent et ce qui date. La date est celle de la source ou du relevé.</p>
    <div class="gpick">${GROUPS.map((x) => `<button class="sw" data-e="${x.slug}" aria-pressed="${x.slug === curE}">${esc(x.name)}</button>`).join("")}</div>
    <div class="tl">${h || '<p class="muted">Aucun fait daté.</p>'}</div>
    <p class="small muted" style="margin-top:18px"><b>Rien de connu</b> (${gaps.length}) : ${gaps.map((i) => `<span class="${cls(state(i).s)}">${esc(i.name)}</span>`).join(" · ")}</p>`;
  document.querySelector("#vE .gpick").onclick = (ev) => { const s = ev.target.closest("button")?.dataset.e; if (s) { curE = s; renderE(); } };
}

const R = { A: renderA, B: renderB, C: renderC, D: renderD, E: renderE };
document.querySelector(".topin").onclick = (ev) => {
  const b = ev.target.closest(".sw"); if (!b) return;
  for (const x of document.querySelectorAll(".topin .sw")) x.setAttribute("aria-pressed", x === b);
  for (const k of Object.keys(R)) document.getElementById("v" + k).hidden = k !== b.dataset.v;
  R[b.dataset.v](); scrollTo(0, 0);
};
renderA();
</script>
</body>
</html>
