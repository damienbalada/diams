<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche M&amp;M's 36 g</title>
<style>
:root{--fond:#f3f2fb;--texte:#160f2e;--gris:#5c5676;--bord:#e7e3f6;--accent:#5a2de0;--carte2:#f0eefb;--alerte:#b3261e;--vig:#d97a00;--page:#e2def2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0f0c22}}
:root[data-theme="dark"]{--page:#0f0c22}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--texte)}
button{font-family:inherit;color:inherit}
a{color:var(--accent)}
.tel{width:390px;max-width:100%;height:844px;margin:24px auto;background:var(--fond);border-radius:28px;border:8px solid #160f2e;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:430px){.tel{margin:0;border:0;border-radius:0;height:100vh;height:100dvh}}
.barre{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--bord);background:var(--fond)}
.fleche{width:44px;height:44px;border:0;background:none;border-radius:22px;font-size:24px;color:var(--accent);cursor:pointer}
.titre{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.defile{flex:1;overflow-y:auto;scroll-behavior:smooth}
.corps{padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
.photo{height:180px;border-radius:16px;background:#fff;border:1px solid var(--bord);padding:12px;position:relative;display:flex;align-items:center;justify-content:center;cursor:zoom-in;width:100%}
.photo img{max-height:154px;max-width:100%;object-fit:contain}
.loupe{position:absolute;right:8px;bottom:8px;background:rgba(22,15,46,.75);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.badge{border:0;color:#fff;font-weight:800;font-size:15px;min-height:36px;padding:0 12px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(22,15,46,.25)}
.mg{display:flex;align-items:center;gap:12px;padding:2px}
.logoM{width:52px;height:52px;padding:6px;border-radius:14px;background:#fff;border:1px solid var(--bord);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logoM img,.logoG img{max-width:100%;max-height:100%;object-fit:contain}
.mgTexte{display:flex;flex-direction:column;gap:4px;min-width:0}
.marque{margin:0;font-size:21px;line-height:26px;font-weight:800}
.groupe{display:flex;align-items:center;gap:6px}
.groupe a{font-size:15px;font-weight:700;color:var(--texte)}
.logoG{width:22px;height:22px;padding:2px;border-radius:5px;background:#fff;border:1px solid var(--bord);display:inline-flex;align-items:center;justify-content:center}
.info{width:24px;height:24px;border-radius:12px;border:0;background:var(--carte2);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}
.bulle{align-self:flex-start;background:var(--texte);color:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:19px}
.avert{background:#111;color:#fff;border-radius:6px;padding:10px 12px;border:3px solid #fff;outline:2px solid #111;display:flex;flex-direction:column;gap:6px}
.avertT{font-size:12.5px;font-weight:800;letter-spacing:.8px}
.avertL{display:flex;gap:8px;align-items:flex-start;text-align:left;background:none;border:0;padding:2px 0;color:#fff;font-size:14px;line-height:19px;cursor:pointer}
.avertL .pt{margin-top:5px}
.avertL b{white-space:nowrap}
.plus{align-self:flex-start;background:none;border:0;color:#fff;text-decoration:underline;font-size:13.5px;font-weight:700;padding:4px 0;cursor:pointer;min-height:32px}
.pt{width:9px;height:9px;border-radius:5px;flex:none;display:inline-block}
h2{margin:4px 0 0;font-size:20px}
.pasts{display:flex;flex-wrap:wrap;gap:8px}
.past{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--bord);font-size:14px;font-weight:700;cursor:pointer}
.past.vide{opacity:.7}
.cpt{font-size:12.5px;color:var(--gris);font-weight:600}
.aide{font-size:13px;line-height:18px;color:var(--gris)}
.panneau{background:#fff;border:1.5px solid;border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.pTete{display:flex;align-items:center;gap:8px}
.pTitre{flex:1;font-size:12.5px;font-weight:800;letter-spacing:.4px}
.replier{background:none;border:0;color:var(--accent);font-size:14px;font-weight:700;min-height:44px;cursor:pointer}
.fait{border-radius:10px;padding:14px 14px 4px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--bord);background:#fff}
.fait.a{border-color:#f0c9c4;background:#fff7f6}.fait.v{border-color:#f2c48a;background:#fffaf2}
.fNom{display:flex;align-items:center;gap:8px}
.fNom span:first-child{flex:1;font-size:14px;font-weight:600;color:var(--gris)}
.fNiv{font-size:12px;color:var(--gris);margin-top:-4px}
.signal{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.signal.a{background:var(--alerte);color:#fff}.signal.v{background:#ffe2b8;color:#6b3a00}
.fVal{font-size:19px;line-height:25px;font-weight:800}
.fait.a .fVal{color:#a8221b}.fait.v .fVal{color:#a85400}
.fPied{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--bord);margin-top:6px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;padding:0;text-align:left;cursor:pointer}
.fPied span:first-child{flex:1;font-size:13px;color:var(--gris)}
.lienD{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.detail{font-size:13.5px;line-height:19px;display:flex;flex-direction:column;gap:8px;padding:2px 0 10px}
.detail blockquote{margin:0;padding:8px 10px;border-left:3px solid var(--bord);background:var(--fond);border-radius:4px;font-size:13px;color:var(--texte)}
.etiquette{font-size:12px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
.vides{background:var(--carte2);border-radius:8px;display:flex;flex-direction:column}
.vides button{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 12px;border:0;background:none;font-size:15px;font-weight:600;color:var(--gris);cursor:pointer;width:100%}
.vides ul{margin:0;padding:0 12px 12px 28px;font-size:13.5px;line-height:19px}
.alt{border:1px dashed #d8a790;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.altM{min-height:34px;padding:4px 10px;border-radius:999px;border:1px solid #9cc9a3;background:#f1f9f2;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pied{font-size:13px;line-height:18px;color:var(--gris)}
.scanner{position:absolute;right:20px;bottom:28px;width:62px;height:62px;border-radius:31px;border:0;background:var(--accent);box-shadow:0 4px 10px rgba(22,15,46,.28);display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.scanner i{display:block;height:24px;background:#fff}
.voile{position:absolute;inset:0;background:rgba(22,15,46,.55);display:none;z-index:10}
.voile.ouvert{display:block}
.feuille{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px 24px;transform:translateY(100%);transition:transform .25s ease;z-index:11;max-height:75%;overflow-y:auto}
.feuille.ouvert{transform:none}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--bord);margin:4px auto 10px}
.fTitre{font-size:18px;font-weight:800;margin:0 0 4px}
.fSous{font-size:13px;color:var(--gris);margin:0 0 10px;line-height:18px}
.motif{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bord);padding:12px 2px;cursor:pointer}
.motif .pt{margin-top:6px}
.mTxt{flex:1;display:flex;flex-direction:column;gap:2px}
.mTxt b{font-size:15px;line-height:20px}
.mTxt span{font-size:12.5px;color:var(--gris)}
.chev{font-size:22px;color:var(--gris)}
.grand{position:absolute;inset:0;background:rgba(10,8,20,.92);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:zoom-out}
.grand.ouvert{display:flex}
.grand img{max-width:92%;max-height:75%;object-fit:contain;background:#fff;border-radius:12px}
.grand span{color:#fff;font-size:14px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--texte);color:#fff;padding:8px 14px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.vu{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="tel" id="tel">
  <div class="barre"><button class="fleche" id="retour" aria-label="Retour">←</button><span class="titre" id="titre"></span></div>
  <div class="defile" id="defile"><div class="corps" id="corps"></div></div>
  <button class="scanner" id="scanner" aria-label="Scanner un code-barres"><i style="width:3px"></i><i style="width:1.5px"></i><i style="width:4px"></i><i style="width:1.5px"></i><i style="width:2.5px"></i><i style="width:4px"></i><i style="width:1.5px"></i><i style="width:3px"></i></button>
  <div class="voile" id="voile"></div>
  <div class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="fTitre"></div>
  <div class="grand" id="grand" role="dialog" aria-label="Photo du produit"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>

": null, "enSavoirPlus": null, "signal": null, "note": "Cherché sans résultat (fichiers de la Commission électorale fédérale (FEC)), le 16/10/2026.", "preuve": null}, {"code": "GEO_RUSSIA_EXIT", "nom": "Sortie de Russie (depuis l'invasion de l'Ukraine)", "niveau": "groupe", "etat": "documente", "valeur": "Russie : activité poursuivie", "raison": null, "repere": null, "enSavoirPlus": null, "signal": {"niveau": "alerte", "motif": "poursuit ses activités en Russie", "regle": "statuts de la base Leave Russia (KSE Institute)"}, "note": null, "preuve": {"source": "Sortie de Russie (KSE Institute, « Leave Russia »)", "solidite": "reconnue", "date": "2026-10-13", "url": "https://leave-russia.org/mars", "citation": "KSE Institute, base « Leave Russia » (consultée le 13/10/2026) : « Mars » — activité poursuivie en Russie ; dernière décision le 07/07/2023 : « The company promised to scale back the business and will refocus in feeding the Russian people and pets. \"Any profits from the Russian business will be used for humanitarian causes. The company will not import or export the products. Factories and sales still operating in… »", "reprisDe": "Mars"}}]}], "renseignes": 12, "total": 40, "estMarque": true, "produitsLus": []};
const TEINTE = {ANI:'#b4532a',ENV:'#1f8a4c',PLA:'#0e7a8a',WAT:'#2563c9',LAB:'#7a3fd0',SUP:'#a86a12',GOV:'#4b5a70',TAX:'#11796d',GEO:'#b8325a',ING:'#2f7a3b'};
const COURT = {ANI:'Bien-être animal',ENV:'Environnement',PLA:'Plastique',WAT:'Eau',LAB:'Travail',SUP:'Chaîne d’appro',GOV:'Gouvernance',TAX:'Fiscalité',GEO:'Géopolitique',ING:'Ingrédients'};
const SOLIDITE = {officielle:'Source officielle',reconnue:'Source reconnue',declarative:'Déclaration de l’entreprise',presse:'Article de presse'};
const R = '#b3261e', O = '#d97a00';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dfr = (d) => d ? d.split('-').reverse().join('/') : '';
const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const quantite = (q) => { const v = (q || '').replace(/\s+[e℮]$/i, '').trim(); return /\d\s*[a-zA-Zµ]/.test(v) ? ' · ' + v : ''; };
const groupe = F.proprietaire ? F.proprietaire.nom : null;
const qui = (niveau) => niveau === 'groupe' && groupe ? groupe : niveau === 'produit' ? 'Ce produit' : F.nom;

// Motifs : une ligne par alerte ou vigilance, avec le pilier, le niveau et l'indicateur d'origine.
const motifs = [];
for (const p of F.piliers) for (const f of p.faits) if (f.signal) motifs.push({ pilier: p.code, icone: p.icone, niveau: f.signal.niveau, motif: f.signal.motif, qui: qui(f.niveau), code: f.code });
motifs.sort((a, b) => (a.niveau === 'alerte' ? 0 : 1) - (b.niveau === 'alerte' ? 0 : 1));
const alertes = motifs.filter((m) => m.niveau === 'alerte'), vigilances = motifs.filter((m) => m.niveau === 'vigilance');
const pluriel = (n, s, p) => n + ' ' + (n > 1 ? p : s);

const etat = { pilier: null, info: false, avertTout: false, ouverts: new Set(), vides: false };

function pastilles() {
  const liste = [...F.piliers.map((p) => ({ code: p.code, icone: p.icone, compte: p.renseignes + '/' + p.total, vide: p.renseignes === 0 })), { code: 'ING', icone: '🧾', compte: String(F.produitsLus?.length || 0), vide: !(F.produitsLus?.length) }];
  return liste.map((p) => {
    const a = motifs.some((m) => m.pilier === p.code && m.niveau === 'alerte'), v = motifs.some((m) => m.pilier === p.code && m.niveau === 'vigilance');
    const actif = etat.pilier === p.code, t = TEINTE[p.code];
    const style = actif ? `border-color:${t};background:${t}1f;color:${t}` : '';
    return `<button class="past${p.vide && !actif ? ' vide' : ''}" style="${style}" data-pilier="${p.code}" role="tab" aria-selected="${actif}"><span aria-hidden="true">${p.icone}</span>${COURT[p.code]}${a || v ? `<span class="pt" style="background:${a ? R : O}" aria-label="${a ? 'alerte' : 'vigilance'}"></span>` : ''}<span class="cpt">${p.compte}</span></button>`;
  }).join('');
}

function fait(f, i) {
  const s = f.signal ? (f.signal.niveau === 'alerte' ? 'a' : 'v') : '';
  const cle = f.code, ouvert = etat.ouverts.has(cle), pr = f.preuve || {};
  const niv = f.niveau === 'groupe' ? `donnée du groupe ${esc(groupe)}` : f.niveau === 'marque' ? `marque ${esc(F.nom)}` : 'produit';
  return `<div class="fait ${s}">
    <div class="fNom"><span>${esc(f.nom)}</span>${s ? `<span class="signal ${s}">${s === 'a' ? '⚠️ Alerte' : '🟠 Vigilance'}</span>` : ''}</div>
    <div class="fNiv">${niv}</div>
    <div class="fVal">${esc(f.valeur)}</div>
    <button class="fPied" data-fait="${esc(cle)}" aria-expanded="${ouvert}"><span>${esc(pr.source)}${pr.date ? ' · ' + dfr(pr.date) : ''}</span><span class="lienD">Détail ${ouvert ? '▲' : '▼'}</span></button>
    ${ouvert ? `<div class="detail">
      ${f.signal ? `<div><span class="etiquette">Pourquoi ${s === 'a' ? 'une alerte' : 'une vigilance'}</span><br>${esc(maj(f.signal.motif))}. Règle : ${esc(f.signal.regle)}.</div>` : ''}
      ${f.repere ? `<div><span class="etiquette">Repère</span><br>${esc(f.repere)}</div>` : ''}
      ${pr.citation ? `<div><span class="etiquette">Ce que dit la source</span><blockquote>${esc(pr.citation)}</blockquote></div>` : ''}
      <div>${SOLIDITE[pr.solidite] ? esc(SOLIDITE[pr.solidite]) + ' · ' : ''}${pr.url ? `<a href="${esc(pr.url)}" target="_blank" rel="noopener">Lire la source ↗</a>` : ''}</div>
    </div>` : ''}
  </div>`;
}

function panneau() {
  const code = etat.pilier; if (!code) return `<div class="aide">Touchez une pastille pour lire le détail du pilier.</div>`;
  const t = TEINTE[code];
  if (code === 'ING') return `<div class="panneau" id="panneau" style="border-color:${t}"><div class="pTete"><span>🧾</span><span class="pTitre" style="color:${t}">INGRÉDIENTS</span><button class="replier" data-replier>Replier ▲</button></div><div class="aide">Aucun produit lu pour l’instant : ni fiche du site de la marque, ni étiquette envoyée.</div><a href="#etiquette" data-toast="Envoi d’étiquette : écran suivant de l’appli">📷 Ajouter l’étiquette d’un produit ${esc(F.nom)}</a></div>`;
  const p = F.piliers.find((x) => x.code === code);
  const docs = p.faits.filter((f) => f.etat !== 'aucune_info').sort((a, b) => (b.signal ? (b.signal.niveau === 'alerte' ? 2 : 1) : 0) - (a.signal ? (a.signal.niveau === 'alerte' ? 2 : 1) : 0));
  const vides = p.faits.filter((f) => f.etat === 'aucune_info');
  const alt = p.alternatives && p.alternatives.marques && p.alternatives.marques.length ? `<div class="alt"><b style="font-size:14px">🔄 Alternatives dans le même secteur</b><span class="aide">Marques d’autres groupes ${esc(p.alternatives.critere)}. Aucune note : c’est ce critère, et lui seul, qui les fait figurer ici.</span><div class="alts">${p.alternatives.marques.slice(0, 6).map((m) => `<span class="altM">${esc(m.nom)}${m.groupe ? ` <span style="color:var(--gris);font-weight:400">· ${esc(m.groupe)}</span>` : ''}</span>`).join('')}${p.alternatives.marques.length > 6 ? `<span class="aide">et ${p.alternatives.marques.length - 6} autres</span>` : ''}</div></div>` : '';
  return `<div class="panneau" id="panneau" style="border-color:${t}">
    <div class="pTete"><span style="font-size:20px">${p.icone}</span><span class="pTitre" style="color:${t}">${esc(p.nom.toUpperCase())}</span><button class="replier" data-replier>Replier ▲</button></div>
    ${docs.length ? docs.map(fait).join('') : '<div class="aide">Rien de documenté pour l’instant.</div>'}
    ${vides.length ? `<div class="vides"><button data-vides aria-expanded="${etat.vides}"><span>${pluriel(vides.length, 'indicateur sans information', 'indicateurs sans information')}</span><span class="lienD">Pourquoi ${etat.vides ? '▲' : '▼'}</span></button>${etat.vides ? `<ul>${vides.map((f) => `<li><b>${esc(f.nom)}</b> : ${esc(f.raison || 'non renseigné')}</li>`).join('')}</ul>` : ''}</div>` : ''}
    ${alt}
  </div>`;
}

function avertissement() {
  const montres = etat.avertTout ? motifs : alertes.slice(0, 2);
  const reste = motifs.length - montres.length;
  return `<div class="avert" role="region" aria-label="Avertissement">
    <span class="avertT">AVERTISSEMENT</span>
    ${montres.map((m) => `<button class="avertL" data-aller="${m.pilier}" data-code="${m.code}"><span class="pt" style="background:${m.niveau === 'alerte' ? R : O}"></span><span><b>${esc(m.qui)}</b> — ${esc(m.motif)}</span></button>`).join('')}
    ${motifs.length > 2 ? `<button class="plus" data-avert>${etat.avertTout ? 'Réduire ▲' : `+ ${pluriel(reste, 'autre motif', 'autres motifs')} ▼`}</button>` : ''}
  </div>`;
}

function rendu() {
  const pr = F.produit;
  document.getElementById('titre').textContent = pr ? pr.nom + quantite(pr.quantite) : F.nom;
  document.getElementById('corps').innerHTML = `
    <div class="photo" id="photo" role="button" tabindex="0" aria-label="Photo du produit, l’agrandir">
      <img src="${pr.image}" alt="">
      <div class="badges">
        ${alertes.length ? `<button class="badge" style="background:${R}" data-feuille="alerte" aria-label="${pluriel(alertes.length, 'alerte', 'alertes')}, voir les motifs">⚠️ ${alertes.length}</button>` : ''}
        ${vigilances.length ? `<button class="badge" style="background:${O}" data-feuille="vigilance" aria-label="${pluriel(vigilances.length, 'vigilance', 'vigilances')}, voir les motifs">🟠 ${vigilances.length}</button>` : ''}
      </div>
      <span class="loupe">🔍 agrandir</span>
    </div>
    <div class="mg">
      <span class="logoM"><img src="${F.logo}" alt=""></span>
      <div class="mgTexte"><h1 class="marque">${esc(F.nom)}</h1>
        ${groupe ? `<span class="groupe"><span class="logoG"><img src="${F.proprietaire.logo}" alt=""></span><a href="#groupe" data-toast="Ouvrirait la fiche du groupe ${esc(groupe)}">${esc(groupe)}</a><button class="info" data-info aria-expanded="${etat.info}" aria-label="À quoi sert ce groupe ?">ⓘ</button></span>` : ''}
      </div>
    </div>
    ${etat.info ? `<div class="bulle">${esc(groupe)} possède la marque : c’est ce groupe qui reçoit l’argent de vos achats.</div>` : ''}
    ${motifs.length ? avertissement() : ''}
    <h2>Pilier par pilier</h2>
    <div class="pasts" role="tablist">${pastilles()}</div>
    ${panneau()}
    <div class="pied">${F.renseignes} informations documentées sur ${F.total} recherchées · aucune note, que des faits sourcés.</div>
    <div class="pied">Produit : ${esc(pr.nom + quantite(pr.quantite))}. ${esc(pr.phrase)}. <a href="${esc(pr.lien)}" target="_blank" rel="noopener">D’après ${esc(pr.base)} ↗</a></div>`;
}

function ouvrirPilier(code, codeFait) {
  etat.pilier = code; etat.vides = false;
  if (codeFait) etat.ouverts.add(codeFait);
  fermerFeuille(); rendu();
  requestAnimationFrame(() => document.getElementById('panneau')?.scrollIntoView({ block: 'start' }));
}

const feuille = document.getElementById('feuille'), voile = document.getElementById('voile');
function ouvrirFeuille(niveau) {
  const liste = niveau === 'alerte' ? alertes : vigilances, c = niveau === 'alerte' ? R : O;
  feuille.innerHTML = `<div class="poignee"></div>
    <h3 class="fTitre" id="fTitre" style="color:${c}">${niveau === 'alerte' ? '⚠️ ' + pluriel(liste.length, 'alerte', 'alertes') : '🟠 ' + pluriel(liste.length, 'vigilance', 'vigilances')}</h3>
    <p class="fSous">${niveau === 'alerte' ? 'Faits sourcés qui dépassent un seuil fixé à l’avance.' : 'Faits sourcés à surveiller, sous le seuil d’alerte.'} Touchez un motif pour lire la preuve.</p>
    ${liste.map((m) => `<button class="motif" data-aller="${m.pilier}" data-code="${m.code}"><span class="pt" style="background:${c}"></span><span class="mTxt"><b>${m.icone} ${esc(maj(m.motif))}</b><span>${COURT[m.pilier]} · ${esc(m.qui)}</span></span><span class="chev">›</span></button>`).join('')}`;
  feuille.classList.add('ouvert'); voile.classList.add('ouvert');
  feuille.querySelector('button')?.focus();
}
function fermerFeuille() { feuille.classList.remove('ouvert'); voile.classList.remove('ouvert'); }

let minuteur;
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('vu'); clearTimeout(minuteur); minuteur = setTimeout(() => e.classList.remove('vu'), 1800); }

const grand = document.getElementById('grand');
function agrandir() { grand.innerHTML = `<img src="${F.produit.image}" alt="Photo du produit"><span>Toucher pour fermer</span>`; grand.classList.add('ouvert'); }

document.getElementById('tel').addEventListener('click', (e) => {
  const b = e.target.closest('[data-feuille],[data-aller],[data-pilier],[data-fait],[data-replier],[data-info],[data-avert],[data-vides],[data-toast]');
  if (!b) { if (e.target.closest('#photo')) agrandir(); return; }
  e.preventDefault(); e.stopPropagation();
  if (b.dataset.feuille) return ouvrirFeuille(b.dataset.feuille);
  if (b.dataset.aller) return ouvrirPilier(b.dataset.aller, b.dataset.code);
  if (b.dataset.pilier) { etat.pilier = etat.pilier === b.dataset.pilier ? null : b.dataset.pilier; etat.vides = false; rendu(); if (etat.pilier) requestAnimationFrame(() => document.getElementById('panneau')?.scrollIntoView({ block: 'nearest' })); return; }
  if (b.dataset.fait) { const k = b.dataset.fait; etat.ouverts.has(k) ? etat.ouverts.delete(k) : etat.ouverts.add(k); return rendu(); }
  if ('replier' in b.dataset) { etat.pilier = null; return rendu(); }
  if ('info' in b.dataset) { etat.info = !etat.info; return rendu(); }
  if ('avert' in b.dataset) { etat.avertTout = !etat.avertTout; return rendu(); }
  if ('vides' in b.dataset) { etat.vides = !etat.vides; return rendu(); }
  if (b.dataset.toast) return toast(b.dataset.toast);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { fermerFeuille(); grand.classList.remove('ouvert'); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.id === 'photo') { e.preventDefault(); agrandir(); }
});
voile.addEventListener('click', fermerFeuille);
grand.addEventListener('click', () => grand.classList.remove('ouvert'));
document.getElementById('retour').addEventListener('click', () => toast('Retour à l’écran précédent'));
document.getElementById('scanner').addEventListener('click', () => toast('Ouvrirait le scanner'));
rendu();
</script>
