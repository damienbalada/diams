<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scanner, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#e7e2ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1b1a20; color: #ffffff; font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 20px 40px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Fermer le scanner" style="width: 44px; height: 44px; border-radius: 22px; background: #3a3842; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Scanner</span>
    <button type="button" aria-label="Allumer la lampe" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #3a3842; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 2h6l-1 6h3l-7 10 1-7H6z"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
    <a href="iOS-Fiche.dc.html" aria-label="Simuler la lecture d'un code-barres" style="position: relative; width: 300px; height: 190px; border-radius: 20px; background: #2a2930; display: grid; place-items: center; text-decoration: none">
      <svg width="300" height="190" viewBox="0 0 300 190" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" aria-hidden="true" style="position: absolute; inset: 0">
        <path d="M6 40V18a12 12 0 0 1 12-12h22M260 6h22a12 12 0 0 1 12 12v22M294 150v22a12 12 0 0 1-12 12h-22M40 184H18a12 12 0 0 1-12-12v-22"></path>
      </svg>
      <span style="width: 200px; height: 96px; background: #f2f2f2; border-radius: 6px; display: flex; gap: 3px; padding: 12px 16px; box-sizing: border-box; align-items: stretch">
        <span style="width: 4px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 6px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 3px; background: #111"></span><span style="width: 7px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 4px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 6px; background: #111"></span><span style="width: 3px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 5px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 4px; background: #111"></span><span style="width: 7px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 3px; background: #111"></span><span style="width: 5px; background: #111"></span><span style="width: 2px; background: #111"></span><span style="width: 4px; background: #111"></span>
      </span>
      <span style="position: absolute; left: 30px; right: 30px; top: 94px; height: 3px; border-radius: 2px; background: {{accent}}"></span>
    </a>
    <p style="margin: 0; font-size: 17px; line-height: 24px; text-align: center; max-width: 290px">Placez le code-barres dans le cadre. La fiche s'ouvre dès qu'il est lu.</p>
    <p style="margin: 0; font-size: 14px; line-height: 20px; text-align: center; color: #c9c6d4; max-width: 290px">Aucune photo n'est gardée : seul le numéro du code est envoyé pour trouver le produit.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="iOS-Inconnu.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #3a3842; font-size: 17px; font-weight: 600; text-decoration: none">Saisir le code à la main</a>
    <a href="#" style="text-align: center; font-size: 15px; color: #d9d4ff">Le scanner ne marche pas ? Autoriser l'appareil photo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8c6cff","options":["#8c6cff","#4fd1c5","#ffb547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8c6cff' };
}
}
</script>
</body>
</html>
